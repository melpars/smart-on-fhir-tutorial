<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <title>Opala-SMART-App</title>

    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
  </head>
  <body>
    <div id='errors'></div>

    <div id="loading" class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>

    <div id='holder' style="display: none;">
      <h2>Opala SMART App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr>
          <th>First Name:</th>
          <td id='fname'></td>
        </tr>
        <tr>
          <th>Last Name:</th>
          <td id='lname'></td>
        </tr>
        <tr>
          <th>Gender:</th>
          <td id='gender'></td>
        </tr>
        <tr>
          <th>Date of Birth:</th>
          <td id='birthdate'></td>
        </tr>
      </table>

      <h2>Observation Resource</h2>
      <table>
        <tr>
          <th>Height:</th>
          <td id='height'></td>
        </tr>
        <tr>
          <th>Systolic Blood Pressure:</th>
          <td id='systolicbp'></td>
        </tr>
        <tr>
          <th>Diastolic Blood Pressure:</th>
          <td id='diastolicbp'></td>
        </tr>
        <tr>
          <th>LDL:</th>
          <td id='ldl'></td>
        </tr>
        <tr>
          <th>HDL:</th>
          <td id='hdl'></td>
        </tr>
      </table>
    </div>

    <!-- Required JS files -->
    <script src='./src/js/example-smart-app.js'></script>
    <script src='./lib/js/fhir-client-v0.1.12.js'></script>
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

    <script>
      console.log("🚀 Running extractData() in index.html...");
    
      // Detect if the authorization code is present
      const urlParams = new URLSearchParams(window.location.search);
      const authCode = urlParams.get("code");
    
      if (authCode) {
          console.log("🔎 Authorization Code Detected:", authCode);
      } else {
          console.error("❌ No authorization code found in URL.");
      }
    
      extractData().then(
        function(p) {
          console.log("✅ Successfully extracted data:", p);
          document.getElementById("loading").style.display = "none";
          document.getElementById("holder").style.display = "block";
          drawVisualization(p);
        },
        function(error) {
          console.error("❌ Failed to fetch FHIR Service:", error);
          document.getElementById("loading").style.display = "none";
          document.getElementById("errors").innerHTML = `<p> ❌ Failed to load patient data. See console for details. </p>`;
        }
      );
    </script>  
  </body>
</html>
