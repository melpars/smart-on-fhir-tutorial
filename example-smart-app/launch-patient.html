<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>SMART App Launch</title>
</head>
<body>

<script src="./lib/js/fhir-client-v0.1.12.js"></script>
<script src="./lib/js/fhir-client-cerner-additions-1.0.0.js"></script>

<script>
    console.log("✅ FHIR loaded:", typeof FHIR);  // should be "object"

    if (typeof FHIR === 'undefined') {
        console.error("❌ FHIR library failed to load.");
        document.body.innerHTML = "<h3>❌ FHIR library failed to load.</h3>";
        throw new Error("FHIR not available");
    }

    // Generate a unique state for this session
    const stateValue = 'SMART-' + Math.random().toString(36).substring(2, 15);

    const fhirBaseUrl = 'https://tst.opala.tech/patient-access/premera/v1/fhir-r4';
    const authorizeUrl = 'https://dev.opala.tech/connect/authorize';
    const tokenUrl = 'https://dev.opala.tech/connect/token';

    // Store the state in both localStorage (for refresh robustness) and sessionStorage (for SMART client expectations)
    console.log("🚀 Storing session data for state:", stateValue);
    const launchData = {
        client: {
            client_id: 'opala-smart-app',
            redirect_uri: 'https://melpars.github.io/smart-on-fhir-tutorial/example-smart-app/'
        },
        provider: {
            oauth2: {
                authorize_uri: authorizeUrl,
                token_uri: tokenUrl
            }
        },
        server: fhirBaseUrl
    };

    localStorage.setItem('smart-launch-state', stateValue);   // backup for manual debug if needed
    sessionStorage.setItem(stateValue, JSON.stringify(launchData));

    // Trigger authorization
    console.log("✅ Calling authorize() with", {
        client_id: 'opala-smart-app',
        scope: 'patient/Patient.read patient/Observation.read launch/patient online_access openid profile',
        redirect_uri: 'https://melpars.github.io/smart-on-fhir-tutorial/example-smart-app/',
        state: stateValue,
        iss: fhirBaseUrl
    });

    FHIR.oauth2.authorize({
        client_id: 'opala-smart-app',
        scope: 'patient/Patient.read patient/Observation.read launch/patient online_access openid profile',
        redirect_uri: 'https://melpars.github.io/smart-on-fhir-tutorial/example-smart-app/',
        state: stateValue,
        iss: fhirBaseUrl
    });
</script>

</body>
</html>
