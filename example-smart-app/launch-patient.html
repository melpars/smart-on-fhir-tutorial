<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>SMART App Launch</title>
</head>
<body>

<script src="./lib/js/fhir-client-v0.1.12.js"></script>
<script src="./lib/js/fhir-client-cerner-additions-1.0.0.js"></script>

<script>
  const stateValue = 'SMART-' + Math.random().toString(36).substring(2, 15);
  localStorage.setItem('smart-launch-state', stateValue);
  
  sessionStorage.setItem(stateValue, JSON.stringify({
      client: {
          client_id: 'opala-smart-app',
          redirect_uri: 'https://melpars.github.io/smart-on-fhir-tutorial/example-smart-app/'
      },
      provider: {
          oauth2: {
              authorize_uri: 'https://dev.opala.tech/connect/authorize',
              token_uri: 'https://dev.opala.tech/connect/token'
          }
      },
      server: 'https://tst.opala.tech/patient-access/premera/v1/fhir-r4'
  }));
  
  FHIR.oauth2.authorize({
      client_id: 'opala-smart-app',
      scope: 'patient/Patient.read patient/Observation.read launch/patient online_access openid profile',
      redirect_uri: 'https://melpars.github.io/smart-on-fhir-tutorial/example-smart-app/',
      state: stateValue,
      iss: 'https://tst.opala.tech/patient-access/premera/v1/fhir-r4'
  });
  </script>
  
</body>
</html>
